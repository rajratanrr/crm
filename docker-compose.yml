version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: studio_crm_db
    environment:
      POSTGRES_DB: studio_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
